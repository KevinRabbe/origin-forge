name: Phase 48 plan role-name correction

on:
  push:
    branches: [chatgpt/phase48-pixelorama-export-dispatch-planning]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout planning branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/phase48-pixelorama-export-dispatch-planning
          fetch-depth: 0

      - name: Correct WorkOrder role spelling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/phase-48-governed-pixelorama-spritesheet-export-production-dispatch.md')
          text = path.read_text(encoding='utf-8')
          old = 'role     = PIXELORAMA_PROJECT'
          if text.count(old) != 1:
              raise SystemExit(f'expected one exact role declaration, got {text.count(old)}')
          text = text.replace(old, 'role     = pixelorama_project')
          old2 = '`ARTIFACT` / `PIXELORAMA_PROJECT` input ref'
          if text.count(old2) != 1:
              raise SystemExit(f'expected one slice role phrase, got {text.count(old2)}')
          text = text.replace(old2, '`ARTIFACT` / `pixelorama_project` input ref')
          old3 = 'ref role is `PIXELORAMA_PROJECT`;'
          if text.count(old3) != 1:
              raise SystemExit(f'expected one binder role phrase, got {text.count(old3)}')
          text = text.replace(old3, 'ref role is `pixelorama_project`;')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Self-remove helper and commit correction
        run: |
          rm .github/workflows/phase48-plan-role-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/phase-48-governed-pixelorama-spritesheet-export-production-dispatch.md .github/workflows/phase48-plan-role-fix.yml
          git diff --cached --check
          git commit -m "docs: correct Phase 48 WorkOrder role"
          git push origin HEAD:chatgpt/phase48-pixelorama-export-dispatch-planning
