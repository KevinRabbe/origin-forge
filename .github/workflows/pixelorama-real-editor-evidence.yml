name: Pixelorama real-editor evidence

on:
  pull_request:
    types: [edited, synchronize]

permissions:
  contents: read

jobs:
  real-editor-gate:
    if: >-
      github.event.pull_request.number == 28 &&
      contains(github.event.pull_request.body, '<!-- phase19-real-editor-evidence -->')
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Origin Forge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Acquire and verify frozen Pixelorama evidence inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # External archive trust anchor: Microsoft WinGet's reviewed Pixelorama 1.2
          # package manifest pins this exact official GitHub release archive.
          $pixeloramaUrl = "https://github.com/Orama-Interactive/Pixelorama/releases/download/v1.2/Pixelorama-Windows-64bit.zip"
          $expectedArchiveSha256 = "1DDC65930DDD435612519E293D1927849D4D4C18928A856B5BD4F058FE2F4A72"

          # Frozen identities learned in the successful compatibility probe and now
          # committed as independent expected values for the authoritative rerun.
          $expectedExecutableSha256 = "07EE2DEFDBF14F335B8F102F224926CC1EF1456BD09F3AF708E948CCADC3D904"
          $expectedFixtureSha256 = "C9D3EB48002D0A68CE718717588B3B43D785171F57DBB85A04E194481CB65FB2"
          $expectedFixtureBytes = 1906

          # Pixelorama issue #1368 supplies this real project as a minimal CLI-export
          # reproduction. GitHub required the reporter to append .zip; the attachment
          # is opaque Pixelorama project bytes and is renamed back to .pxo locally.
          $fixtureUrl = "https://github.com/user-attachments/files/23172167/layers-test.pxo.zip"

          $archive = Join-Path $env:RUNNER_TEMP "Pixelorama-Windows-64bit.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "pixelorama-v1.2"
          $fixture = Join-Path $env:RUNNER_TEMP "layers-test.pxo"

          curl.exe -L --fail --silent --show-error $pixeloramaUrl -o $archive
          $actualArchiveSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualArchiveSha256 -ne $expectedArchiveSha256) {
            throw "Pixelorama archive SHA-256 mismatch: $actualArchiveSha256"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
          $executable = Join-Path $extractRoot "Pixelorama-Windows-64bit\Pixelorama.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Pinned Pixelorama executable missing after verified archive extraction"
          }
          $actualExecutableSha256 = (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualExecutableSha256 -ne $expectedExecutableSha256) {
            throw "Pixelorama executable SHA-256 mismatch: $actualExecutableSha256"
          }

          curl.exe -L --fail --silent --show-error $fixtureUrl -o $fixture
          if (-not (Test-Path -LiteralPath $fixture -PathType Leaf)) {
            throw "Pixelorama issue fixture was not downloaded"
          }
          $actualFixtureSha256 = (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash.ToUpperInvariant()
          $actualFixtureBytes = (Get-Item -LiteralPath $fixture).Length
          if ($actualFixtureSha256 -ne $expectedFixtureSha256) {
            throw "Pixelorama fixture SHA-256 mismatch: $actualFixtureSha256"
          }
          if ($actualFixtureBytes -ne $expectedFixtureBytes) {
            throw "Pixelorama fixture byte-count mismatch: $actualFixtureBytes"
          }

          Write-Host "PIN_PIXELORAMA_ARCHIVE_SHA256=sha256:$($actualArchiveSha256.ToLowerInvariant())"
          Write-Host "PIN_PIXELORAMA_EXECUTABLE_SHA256=sha256:$($actualExecutableSha256.ToLowerInvariant())"
          Write-Host "PIN_PIXELORAMA_FIXTURE_SHA256=sha256:$($actualFixtureSha256.ToLowerInvariant())"
          Write-Host "PIN_PIXELORAMA_FIXTURE_BYTES=$actualFixtureBytes"

          "ORIGIN_FORGE_PIXELORAMA_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ORIGIN_FORGE_PIXELORAMA_EXECUTABLE_SHA256=sha256:$($expectedExecutableSha256.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ORIGIN_FORGE_PIXELORAMA_FIXTURE_PXO=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ORIGIN_FORGE_PIXELORAMA_FIXTURE_SHA256=sha256:$($expectedFixtureSha256.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ORIGIN_FORGE_PIXELORAMA_VERSION=v1.2-stable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run frozen real Pixelorama CLI gate
        env:
          PYTHONPATH: src
        run: >-
          python -W error::ResourceWarning -m unittest discover -s tests
          -p "test_pixelorama_cli_export.py" -v
