name: Phase 48F bounded currentness repair

on:
  push:
    branches:
      - chatgpt/phase48f-pixelorama-invocation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/phase48f-pixelorama-invocation
      - name: Apply exact repair and self-remove
        env:
          OLD_IMPORT: ZnJvbSAucHJvZHVjdGlvbl93b3JrX29yZGVyX21vZGVscyBpbXBvcnQgUHJvZHVjdGlvbldvcmtPcmRlck1vZGVsRXJyb3IK
          NEW_IMPORT: ZnJvbSAucHJvZHVjdGlvbl93b3JrX29yZGVyX21vZGVscyBpbXBvcnQgKAogICAgUHJvZHVjdGlvbldvcmtPcmRlck1vZGVsRXJyb3IsCiAgICBXb3JrT3JkZXJJbnB1dFJlZiwKICAgIFdvcmtPcmRlclJlZlR5cGUsCikK
          OLD_BLOCK: 
          NEW_BLOCK: 
          OLD_METRIC: 
          NEW_METRIC: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("src/origin_forge/production_preparation_status.py")
          text = path.read_text(encoding="utf-8")
          for old_name, new_name in (
              ("OLD_IMPORT", "NEW_IMPORT"),
              ("OLD_BLOCK", "NEW_BLOCK"),
              ("OLD_METRIC", "NEW_METRIC"),
          ):
              old = base64.b64decode(os.environ[old_name]).decode("utf-8")
              new = base64.b64decode(os.environ[new_name]).decode("utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one {old_name} match, found {text.count(old)}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/phase48f-repair.yml
          git config user.name "origin-forge-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/origin_forge/production_preparation_status.py .github/workflows/phase48f-repair.yml
          git commit -m "fix: revalidate Pixelorama planner refs during preparation currentness"
          git push origin HEAD:chatgpt/phase48f-pixelorama-invocation
