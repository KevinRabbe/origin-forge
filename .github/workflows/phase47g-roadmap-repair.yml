name: Phase 47G exact roadmap repair

on:
  push:
    branches:
      - chatgpt/phase47g-documentation-closure

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/phase47g-documentation-closure
          fetch-depth: 0
      - name: Restore exact Phase 43 closure wording
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/roadmap.md")
          text = path.read_text(encoding="utf-8")
          wrong = "**Merge gate:** this documentation/operator-guide/roadmap closure head must itself pass the normal Python 3.12/3.13 matrix with `ResourceWarning` treated as error before ready-for-review transition and SHA-guarded merge.\n\n## Phase 44 — Governed Manager Operator Invocation — DONE"
          right = "**Merge gate:** this documentation/roadmap closure head must itself pass the normal Python 3.12/3.13 matrix with `ResourceWarning` treated as error before ready-for-review transition and SHA-guarded merge.\n\n## Phase 44 — Governed Manager Operator Invocation — DONE"
          if text.count(wrong) != 1:
              raise SystemExit("expected exactly one Phase 43 roadmap drift occurrence")
          text = text.replace(wrong, right)
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/phase47g-roadmap-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap.md .github/workflows/phase47g-roadmap-repair.yml
          git diff --cached --exit-code && { echo "repair produced no change"; exit 1; } || true
          git commit -m "docs: restore phase43 closure wording"
          git push origin HEAD:chatgpt/phase47g-documentation-closure
