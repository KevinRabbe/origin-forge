name: Phase 48G documentation patch

on:
  push:
    branches:
      - chatgpt/phase48g-implementation-closure

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/phase48g-implementation-closure
      - name: Apply documentation patch
        run: python .github/phase48g_docs_patch.py
      - name: Commit documentation and remove helpers
        run: |
          rm .github/phase48g_docs_patch.py
          rm .github/workflows/phase48g-docs.yml
          git config user.name "origin-forge-ci"
          git config user.email "actions@users.noreply.github.com"
          git add docs/operator-guide.md docs/roadmap.md .github/phase48g_docs_patch.py .github/workflows/phase48g-docs.yml
          git commit -m "docs: close Phase 48 operator and roadmap evidence"
          git push origin HEAD:chatgpt/phase48g-implementation-closure
