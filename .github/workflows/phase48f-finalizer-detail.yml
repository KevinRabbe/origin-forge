name: Phase 48F finalizer detail diagnostic

on:
  push:
    branches:
      - chatgpt/phase48f-pixelorama-invocation

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Capture post-planner finalizer detail and self-remove
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from unittest.mock import patch
          from origin_forge.production_manager_advance_once import advance_production_manager_once
          from origin_forge.scheduled_model_adapter import ScheduledModelAdapter
          from tests.test_phase48f_pixelorama_cross_phase_acceptance import Phase48FPixeloramaCrossPhaseAcceptanceTests

          case = Phase48FPixeloramaCrossPhaseAcceptanceTests(methodName='runTest')
          scenario = case._scenario(steps=1)
          try:
              with patch.object(ScheduledModelAdapter, 'generate', return_value=case._planner_response(scenario)):
                  first = advance_production_manager_once(scenario.runtime)
                  second = advance_production_manager_once(scenario.runtime)
              payload = {'first': first.to_dict(), 'second': second.to_dict()}
              open('.github/phase48f-finalizer-detail.json', 'w', encoding='utf-8').write(json.dumps(payload, indent=2, sort_keys=True))
          finally:
              case.doCleanups()
          PY
          rm .github/workflows/phase48f-finalizer-detail.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/phase48f-finalizer-detail.json .github/workflows/phase48f-finalizer-detail.yml
          git commit -m "Phase 48F: capture finalizer recovery detail"
          git push
