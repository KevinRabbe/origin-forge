name: Phase 48F input authority repair

on:
  push:
    branches:
      - chatgpt/phase48f-pixelorama-invocation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair planner-return input authority and self-remove diagnostics
        run: |
          python .github/phase48f_input_authority_patch.py
          python -m py_compile \
            src/origin_forge/production_preparation_input_authority.py \
            src/origin_forge/production_preparation_planner_boundary.py \
            src/origin_forge/production_preparation_planner_same_call.py \
            src/origin_forge/production_preparation_receipts.py
          rm -f \
            .github/phase48f_input_authority_patch.py \
            .github/phase48f-detail-diagnostic.txt \
            .github/phase48f-diagnostic.txt \
            .github/workflows/phase48f-input-authority-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Phase 48F: revalidate frozen planner input authority"
          git push
