name: Phase 48F planner detail diagnostic

on:
  push:
    branches:
      - chatgpt/phase48f-pixelorama-invocation

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Capture exact first Manager result and self-remove
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY' > .github/phase48f-detail-diagnostic.txt 2>&1
          import json
          from unittest.mock import patch
          from tests.test_phase48f_pixelorama_cross_phase_acceptance import Phase48FPixeloramaCrossPhaseAcceptanceTests
          from origin_forge.production_manager_advance_once import advance_production_manager_once
          from origin_forge.scheduled_model_adapter import ScheduledModelAdapter
          case = Phase48FPixeloramaCrossPhaseAcceptanceTests('test_full_manager_path_exports_once_and_stops_with_task_running')
          scenario = case._scenario(steps=1)
          try:
              with patch.object(ScheduledModelAdapter, 'generate', return_value=case._planner_response(scenario)):
                  result = advance_production_manager_once(scenario.runtime)
              print(json.dumps(result.to_dict(), indent=2, sort_keys=True))
          finally:
              case.doCleanups()
          PY
          rm -f .github/phase48f-diagnostic.txt
          rm .github/workflows/phase48f-detail-diagnostic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github
          git commit -m "Phase 48F: capture planner detail diagnostic"
          git push
