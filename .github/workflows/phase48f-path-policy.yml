name: Phase 48F source path policy

on:
  push:
    branches:
      - chatgpt/phase48f-pixelorama-invocation

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bind Pixelorama source materialization to portable path policy
        run: |
          python .github/phase48f_path_policy_patch.py
          python -m py_compile src/origin_forge/production_dispatch_invocation_pixelorama.py
          rm .github/phase48f_path_policy_patch.py .github/workflows/phase48f-path-policy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/origin_forge/production_dispatch_invocation_pixelorama.py .github/phase48f_path_policy_patch.py .github/workflows/phase48f-path-policy.yml
          git commit -m "Phase 48F: enforce canonical Pixelorama source path policy"
          git push
