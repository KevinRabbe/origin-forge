name: Phase 48F preparation input integration

on:
  push:
    branches:
      - chatgpt/phase48f-pixelorama-invocation

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate frozen Artifact allow-list into Pixelorama preparation
        run: |
          cat > /tmp/phase48f_patch.py <<'PY'
          from pathlib import Path

          path = Path('src/origin_forge/production_preparation_planner_boundary.py')
          text = path.read_text()
          old = 'from dataclasses import dataclass\n\nfrom .production_capability_routing import ('
          new = 'from dataclasses import dataclass\n\nfrom .ids import IdKind, validate_id\nfrom .production_capability_routing import ('
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = 'from .production_work_order_models import DispatchContractCatalog\n'
          new = '''from .production_work_order_models import (\n    DispatchContract,\n    DispatchContractCatalog,\n    WorkOrderInputRef,\n    WorkOrderRefType,\n)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          anchor = '''class PreparationPlannerBoundaryError(RuntimeError):\n    pass\n\n\n@dataclass(frozen=True)\nclass RoutedPreparationPlannerBoundary:\n'''
          replacement = '''class PreparationPlannerBoundaryError(RuntimeError):\n    pass\n\n\n_PIXELORAMA_PREPARATION_OWNER_ID = (\n    \"originforge.preparation.pixelorama-spritesheet-export-planner@1\"\n)\n_PIXELORAMA_PROJECT_ROLE = \"pixelorama_project\"\n\n\ndef _planner_allowed_input_refs(planning_input, owner_id: str, contract: DispatchContract) -> tuple[WorkOrderInputRef, ...]:\n    \"\"\"Project frozen PlanningInput evidence into owner-specific WorkOrder choices.\"\"\"\n\n    if owner_id == _PIXELORAMA_PREPARATION_OWNER_ID:\n        if (\n            contract.max_input_refs != 1\n            or contract.allowed_input_ref_types != (WorkOrderRefType.ARTIFACT,)\n        ):\n            raise PreparationPlannerBoundaryError(\n                \"Pixelorama preparation owner contract input authority drifted\"\n            )\n        refs = tuple(\n            WorkOrderInputRef(\n                ref_type=WorkOrderRefType.ARTIFACT,\n                ref_id=value.ref_id,\n                content_hash=value.content_hash,\n                role=_PIXELORAMA_PROJECT_ROLE,\n                revision=None,\n            )\n            for value in planning_input.verified_state_refs\n            if value.revision is None and validate_id(value.ref_id, IdKind.ARTIFACT)\n        )\n        return tuple(\n            sorted(\n                refs,\n                key=lambda value: (value.ref_id, value.content_hash, value.role),\n            )\n        )\n    if contract.max_input_refs != 0:\n        raise PreparationPlannerBoundaryError(\n            \"current dispatch contract exceeds exact v1 preparation-owner authority\"\n        )\n    return ()\n\n\n@dataclass(frozen=True)\nclass RoutedPreparationPlannerBoundary:\n'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, replacement, 1)
          old = '''    dependencies: PreparationPlannerDependencies\n    dispatch_catalog: DispatchContractCatalog\n'''
          new = '''    dependencies: PreparationPlannerDependencies\n    dispatch_catalog: DispatchContractCatalog\n    allowed_input_refs: tuple[WorkOrderInputRef, ...] = ()\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''            or contract.content_hash != owner.supported_dispatch_contract_hash\n            or contract.adapter_fingerprint != owner.supported_adapter_fingerprint\n            or contract.max_input_refs != 0\n        ):\n            raise PreparationPlannerBoundaryError(\n                \"current dispatch contract exceeds exact v1 preparation-owner authority\"\n            )\n'''
          new = '''            or contract.content_hash != owner.supported_dispatch_contract_hash\n            or contract.adapter_fingerprint != owner.supported_adapter_fingerprint\n        ):\n            raise PreparationPlannerBoundaryError(\n                \"current dispatch contract exceeds exact v1 preparation-owner authority\"\n            )\n        allowed_input_refs = _planner_allowed_input_refs(\n            provenance.planning_input,\n            owner.owner_id,\n            contract,\n        )\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''        dependencies=dependencies,\n        dispatch_catalog=dispatch_catalog,\n    )\n'''
          new = '''        dependencies=dependencies,\n        dispatch_catalog=dispatch_catalog,\n        allowed_input_refs=allowed_input_refs,\n    )\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('src/origin_forge/production_preparation_planner_same_call.py')
          text = path.read_text()
          old = '''from .production_preparation_planner_boundary import (\n    PreparationPlannerBoundaryError,\n    RoutedPreparationPlannerBoundary,\n)\n'''
          new = '''from .production_preparation_planner_boundary import (\n    PreparationPlannerBoundaryError,\n    RoutedPreparationPlannerBoundary,\n    _planner_allowed_input_refs,\n)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''            or contract.content_hash != owner.supported_dispatch_contract_hash\n            or contract.adapter_fingerprint != owner.supported_adapter_fingerprint\n            or contract.max_input_refs != 0\n        ):\n            raise PreparationPlannerBoundaryError(\n                \"current dispatch contract exceeds exact v1 preparation-owner authority\"\n            )\n'''
          new = '''            or contract.content_hash != owner.supported_dispatch_contract_hash\n            or contract.adapter_fingerprint != owner.supported_adapter_fingerprint\n        ):\n            raise PreparationPlannerBoundaryError(\n                \"current dispatch contract exceeds exact v1 preparation-owner authority\"\n            )\n        allowed_input_refs = _planner_allowed_input_refs(\n            provenance.planning_input,\n            owner.owner_id,\n            contract,\n        )\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''        dependencies=dependencies,\n        dispatch_catalog=dispatch_catalog,\n    )\n'''
          new = '''        dependencies=dependencies,\n        dispatch_catalog=dispatch_catalog,\n        allowed_input_refs=allowed_input_refs,\n    )\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('src/origin_forge/production_preparation_planner_resume.py')
          text = path.read_text()
          old = '''        planner_result = planner.propose(\n            started.route_decision_id,\n            allowed_input_refs=(),\n        )\n'''
          new = '''        planner_result = planner.propose(\n            started.route_decision_id,\n            allowed_input_refs=boundary.allowed_input_refs,\n        )\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
          python /tmp/phase48f_patch.py
          rm .github/workflows/phase48f-preparation-inputs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/origin_forge/production_preparation_planner_boundary.py src/origin_forge/production_preparation_planner_same_call.py src/origin_forge/production_preparation_planner_resume.py .github/workflows/phase48f-preparation-inputs.yml
          git commit -m "Phase 48F: authorize frozen Pixelorama planning Artifact refs"
          git push
