name: Phase 48F syntax repair

on:
  push:
    branches:
      - chatgpt/phase48f-pixelorama-invocation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Phase 47F source-inspection concatenation and self-remove
        run: |
          sed -i '628,629c\        source = inspect.getsource(invocation_module._legacy_dispatch_claim_once) + "\\n" + inspect.getsource(invocation_module.dispatch_claim_once)' tests/test_phase47f_simulation_cross_phase_acceptance.py
          python -m py_compile tests/test_phase47f_simulation_cross_phase_acceptance.py
          rm .github/workflows/phase48f-preparation-inputs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_phase47f_simulation_cross_phase_acceptance.py .github/workflows/phase48f-preparation-inputs.yml
          git commit -m "Phase 48F: repair Phase 47F source inspection syntax"
          git push
