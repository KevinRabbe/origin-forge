name: Phase 48F preparation input integration

on:
  push:
    branches:
      - chatgpt/phase48f-pixelorama-invocation

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate frozen Pixelorama planning Artifact refs and self-remove
        run: |
          python .github/phase48f_preparation_patch.py
          python -m py_compile src/origin_forge/production_preparation_planner_boundary.py src/origin_forge/production_preparation_planner_same_call.py src/origin_forge/production_preparation_planner_resume.py
          rm .github/phase48f_preparation_patch.py .github/workflows/phase48f-preparation-inputs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/origin_forge/production_preparation_planner_boundary.py src/origin_forge/production_preparation_planner_same_call.py src/origin_forge/production_preparation_planner_resume.py .github/phase48f_preparation_patch.py .github/workflows/phase48f-preparation-inputs.yml
          git commit -m "Phase 48F: authorize frozen Pixelorama planning Artifact refs"
          git push
