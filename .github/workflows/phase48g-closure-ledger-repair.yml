name: Phase 48G closure evidence repair

on:
  push:
    branches:
      - chatgpt/phase48g-closure-ledger-repair
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/phase48g-closure-ledger-repair
          fetch-depth: 0
      - name: Correct exact Phase 48 evidence ledger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/phase-48-implementation-closure.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '- **Phase-48 planning — PR #108:** exact accepted head `52411df4` / normal run `31915469094` / #1369 passed Python 3.12 and Python 3.13; merged as `e52a101e`.': '- **Phase-48 planning — PR #108:** exact accepted head `52411df4e876a7bb2c0a2fc6023e15abb6eb87c4` / normal run `31915469094` / #1369 passed Python 3.12 and Python 3.13; merged as `e52a101e578783c7731bdde0d53051a586f5791a`.',
              '- **48A — exact WorkOrder contract — PR #109:** exact accepted head `c6e32857` / normal run `31915910291` / #1371 passed Python 3.12 and Python 3.13; merged as `d0097e52`.': '- **48A — exact WorkOrder contract — PR #109:** exact accepted head `c6e328575db4ecaa7b0ca3c191ede56f42857f92` / normal run `31915910291` / #1371 passed Python 3.12 and Python 3.13; merged as `d0097e521b94aa2e576f3f3afb8acb09c8147ecf`.',
              '- **48C — Pixelorama preparation owner — PR #111:** exact accepted head `12e10bcbbba5a19d286dbd924ef1270ef929b900` / normal run `31924707175` / #1403 passed Python 3.12 and Python 3.13; merged as `8cef4f62c8d22d06e24b7d768205baeefd73d437`.': '- **48C — Pixelorama preparation owner — PR #111:** exact accepted head `12e10bcbbba5a19d286dbd924ef1270ef929b900` / normal run `31926045992` / #1376 passed Python 3.12 and Python 3.13; merged as `4101b1568f1effdbc8e595afc558bce76cafc942`.',
              '- **48D — execution owner + atomic start — PR #112:** exact accepted head `66d8c52d4d8f57eed43ddb376a06981ea0bf71e1` / normal run `31928255035` / #1408 passed Python 3.12 and Python 3.13; merged as `4ebaba55efec22382fa0b47b43202aa152ee07f8`.': '- **48D — execution owner + atomic start — PR #112:** exact accepted head `66d8c52d4d8f57eed43ddb376a06981ea0bf71e1` / normal run `31929383977` / #1382 passed Python 3.12 and Python 3.13; merged as `4ebaba55efec22382fa0b47b43202aa152ee07f8`.',
              '- **Phase-34 persisted Pixelorama currentness repair — PR #113:** exact accepted head `4e3bafee120232f607c6405c1dfee6acb33b8845` / normal run `31929089584` / #1410 passed Python 3.12 and Python 3.13; merged as `b05658dc37bd6bfd42c7c04b29b48821b4d0d128`.': '- **Phase-34 persisted Pixelorama currentness repair — PR #113:** exact accepted head `4e3bafee120232f607c6405c1dfee6acb33b8845` / normal run `31929132808` / #1380 passed Python 3.12 and Python 3.13; merged as `b05658dc37bd6bfd42c7c04b29b48821b4d0d128`.',
              '- **48E — durable direct CLI export service — PR #114:** exact accepted head `2e1131c85adf3039cd2685c7380300ebfdc6b7ea` / normal run `31936867196` / #1413 passed Python 3.12 and Python 3.13; merged as `c1072a0f8c1526331f9f0797b10168061943206f`.': '- **48E — durable direct CLI export service — PR #114:** exact accepted head `2e1131c85adf3039cd2685c7380300ebfdc6b7ea` / normal run `31930898625` / #1384 passed Python 3.12 and Python 3.13; merged as `c1072a0f8c1526331f9f0797b10168061943206f`.',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ledger marker count {count}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          helper = Path('.github/workflows/phase48g-closure-ledger-repair.yml')
          helper.unlink()
          PY

          git config user.name origin-forge-ci
          git config user.email actions@users.noreply.github.com
          git add docs/phase-48-implementation-closure.md .github/workflows/phase48g-closure-ledger-repair.yml
          git diff --cached --check
          git commit -m "docs: correct Phase 48 closure evidence ledger"
          git push origin HEAD:chatgpt/phase48g-closure-ledger-repair
