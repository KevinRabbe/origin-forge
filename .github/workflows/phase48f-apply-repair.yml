name: Phase 48F apply planner evidence repair

on:
  push:
    branches:
      - chatgpt/phase48f-pixelorama-invocation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/phase48f-pixelorama-invocation
      - name: Apply repair
        run: python .github/phase48f_planner_evidence_repair.py
      - name: Commit repair and remove helpers
        run: |
          rm .github/phase48f_planner_evidence_repair.py
          rm .github/workflows/phase48f-apply-repair.yml
          git config user.name "origin-forge-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/origin_forge/production_preparation_planner_evidence.py .github/phase48f_planner_evidence_repair.py .github/workflows/phase48f-apply-repair.yml
          git commit -m "fix: recover Pixelorama planner input authority"
          git push origin HEAD:chatgpt/phase48f-pixelorama-invocation
