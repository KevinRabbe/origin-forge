name: v0.5.0 immutable tag proof

on:
  push:
    branches: [chatgpt/v0.5-release-tag-r3]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R3 helper branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.5-release-tag-r3
          fetch-depth: 0

      - name: Create exact annotated release tag
        run: |
          set -euo pipefail
          RELEASE_COMMIT=8ac46ee5f14654187469e79b021dbbd83992270b
          test "$(git cat-file -t "$RELEASE_COMMIT")" = commit
          if git ls-remote --exit-code --tags origin refs/tags/v0.5.0 >/dev/null 2>&1; then
            echo "v0.5.0 already exists; refusing to move or replace it" >&2
            exit 1
          fi
          git config user.name "KevinRabbe"
          git config user.email "rabbekevin@icloud.com"
          git tag -a v0.5.0 "$RELEASE_COMMIT" -m "Origin Forge v0.5.0"
          test "$(git rev-parse 'v0.5.0^{commit}')" = "$RELEASE_COMMIT"
          git push origin refs/tags/v0.5.0

      - name: Self-remove R3 helper
        run: |
          rm .github/workflows/v05-r3-tag.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/v05-r3-tag.yml
          git commit -m "chore: remove v0.5.0 tag helper"
          git push origin HEAD:chatgpt/v0.5-release-tag-r3
