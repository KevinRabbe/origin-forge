name: Phase 49A schema bootstrap

on:
  push:
    branches:
      - chatgpt/phase49a-pixelorama-dispatch-output-binding

permissions:
  contents: write

jobs:
  patch-schema:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/phase49a-pixelorama-dispatch-output-binding
          fetch-depth: 0
      - name: Insert migration 13 and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/origin_forge/migrations.py")
          text = path.read_text(encoding="utf-8")
          anchor = "\nMIGRATIONS = (\n"
          if text.count(anchor) != 1:
              raise SystemExit("unexpected MIGRATIONS anchor count")
          migration = r'''

MIGRATION_013 = r"""
CREATE TABLE pixelorama_dispatch_output_bindings (
    execution_id TEXT PRIMARY KEY REFERENCES dispatch_executions(execution_id) ON DELETE CASCADE,
    claim_id TEXT NOT NULL UNIQUE,
    task_id TEXT NOT NULL,
    task_revision INTEGER NOT NULL CHECK (task_revision >= 0),
    task_content_hash TEXT NOT NULL CHECK (length(task_content_hash) = 64),
    work_order_id TEXT NOT NULL,
    work_order_hash TEXT NOT NULL CHECK (length(work_order_hash) = 64),
    dispatch_binding_id TEXT NOT NULL,
    dispatch_binding_hash TEXT NOT NULL CHECK (length(dispatch_binding_hash) = 64),
    execution_owner_id TEXT NOT NULL CHECK (
        execution_owner_id = 'originforge.execution.pixelorama.spritesheet-export@1'
    ),
    run_id TEXT NOT NULL UNIQUE,
    request_artifact_id TEXT NOT NULL UNIQUE,
    result_artifact_id TEXT NOT NULL UNIQUE,
    output_artifact_id TEXT NOT NULL UNIQUE,
    output_verification_id TEXT NOT NULL UNIQUE,
    run_verification_id TEXT NOT NULL UNIQUE,
    output_content_hash TEXT NOT NULL CHECK (length(output_content_hash) = 64),
    output_byte_count INTEGER NOT NULL CHECK (output_byte_count >= 0),
    schema_version INTEGER NOT NULL CHECK (schema_version = 1),
    created_at TEXT NOT NULL CHECK (length(created_at) > 0)
);

CREATE INDEX idx_pixelorama_dispatch_output_bindings_task
ON pixelorama_dispatch_output_bindings(task_id, created_at, execution_id);
"""
'''
          text = text.replace(anchor, migration + anchor)
          old = "    Migration(12, MIGRATION_012),\n)"
          new = "    Migration(12, MIGRATION_012),\n    Migration(13, MIGRATION_013),\n)"
          if text.count(old) != 1:
              raise SystemExit("unexpected migration tuple tail")
          text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/phase49a-schema-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Phase 49A: add Pixelorama dispatch output binding schema"
          git push origin HEAD:chatgpt/phase49a-pixelorama-dispatch-output-binding
