name: Phase 48B Pixelorama binder wiring

on:
  push:
    branches: [chatgpt/phase48b-pixelorama-export-binding]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 48B branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/phase48b-pixelorama-export-binding
          fetch-depth: 0

      - name: Wire public binder inventory and review exactly
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          binding = 'src/origin_forge/production_dispatch_binding.py'
          replace_once(binding, '# Phase 47B keeps the accepted Phase-34 implementation byte-identical in the\n# internal core module and narrows this public compatibility surface to the one\n# authority expansion required here: one additional reviewed simulation binder.\n', '# Phase 48B keeps the accepted Phase-34 core implementation byte-identical and\n# expands only this public compatibility surface with the reviewed Pixelorama\n# spritesheet-export binder alongside the existing code and simulation binders.\n', 'public binder comment')
          replace_once(binding, 'from .production_dispatch_binding_simulation import DeterministicSimulationInputBinder\n', 'from .production_dispatch_binding_pixelorama import PixeloramaSpritesheetExportInputBinder\nfrom .production_dispatch_binding_simulation import DeterministicSimulationInputBinder\n', 'Pixelorama binder import')
          replace_once(binding, '    """Return exactly the two reviewed Phase-47 production input binders."""\n\n    return (\n        CodeBoundedRetryInputBinder(),\n        DeterministicSimulationInputBinder(),\n    )\n', '    """Return exactly the three reviewed production input binders through Phase 48B."""\n\n    return (\n        CodeBoundedRetryInputBinder(),\n        DeterministicSimulationInputBinder(),\n        PixeloramaSpritesheetExportInputBinder(),\n    )\n', 'public binder inventory')

          review = 'src/origin_forge/production_dispatch_binding_review.py'
          replace_once(review, '        BuiltinBindingReview(\n            "originforge.pixelorama.export",\n            BuiltinBindingReviewStatus.DEFERRED,\n            "NO_COMPLETE_TYPED_PIXELORAMA_INPUT",\n            "34C admits no exact Pixelorama project/profile resolver, so the Phase-33 dispatch contract remains intentionally absent",\n        ),\n', '        BuiltinBindingReview(\n            "originforge.pixelorama.export",\n            BuiltinBindingReviewStatus.BINDABLE,\n            None,\n            "Phase-48A exposes pixelorama.spritesheet-export@1 and Phase-48B reconstructs the exact one-Artifact metadata-only Pixelorama export request without opening bytes or selecting editor authority",\n        ),\n', 'Pixelorama review row')
          replace_once(review, '    simulation_dispatch_catalog = build_builtin_dispatch_catalog(simulation_phase32)\n    resolver_registry = build_dispatch_input_resolver_registry()\n', '    simulation_dispatch_catalog = build_builtin_dispatch_catalog(simulation_phase32)\n    pixelorama_phase32 = CapabilityCatalog.create(\n        (phase32.capability("media.2d.export"),),\n        (phase32.adapter("originforge.pixelorama.export"),),\n    )\n    pixelorama_dispatch_catalog = build_builtin_dispatch_catalog(pixelorama_phase32)\n    resolver_registry = build_dispatch_input_resolver_registry()\n', 'Pixelorama reviewed dispatch view')
          replace_once(review, '    reviewed_contracts = (\n        *code_dispatch_catalog.contracts,\n        *simulation_dispatch_catalog.contracts,\n    )\n', '    reviewed_contracts = (\n        *code_dispatch_catalog.contracts,\n        *simulation_dispatch_catalog.contracts,\n        *pixelorama_dispatch_catalog.contracts,\n    )\n', 'reviewed contracts inventory')

          review_test = 'tests/test_production_dispatch_binding_review.py'
          replace_once(review_test, '        simulation_dispatch = build_builtin_dispatch_catalog(simulation_phase32)\n        binder_registry = build_builtin_dispatch_binder_registry()\n', '        simulation_dispatch = build_builtin_dispatch_catalog(simulation_phase32)\n        pixelorama_phase32 = CapabilityCatalog.create(\n            (phase32.capability("media.2d.export"),),\n            (phase32.adapter("originforge.pixelorama.export"),),\n        )\n        pixelorama_dispatch = build_builtin_dispatch_catalog(pixelorama_phase32)\n        binder_registry = build_builtin_dispatch_binder_registry()\n', 'review test Pixelorama dispatch view')
          replace_once(review_test, '            {\n                "originforge.code.bounded-retry",\n                "originforge.simulation.deterministic",\n            },\n', '            {\n                "originforge.code.bounded-retry",\n                "originforge.pixelorama.export",\n                "originforge.simulation.deterministic",\n            },\n', 'review test bindable set')
          replace_once(review_test, '        reviewed_contracts = (*code_dispatch.contracts, *simulation_dispatch.contracts)\n', '        reviewed_contracts = (\n            *code_dispatch.contracts,\n            *simulation_dispatch.contracts,\n            *pixelorama_dispatch.contracts,\n        )\n', 'review test contracts')
          replace_once(review_test, '        self.assertEqual(\n            simulation_dispatch.contract_ids,\n            ("simulation.deterministic@1",),\n        )\n', '        self.assertEqual(\n            simulation_dispatch.contract_ids,\n            ("simulation.deterministic@1",),\n        )\n        self.assertEqual(\n            pixelorama_dispatch.contract_ids,\n            ("pixelorama.spritesheet-export@1",),\n        )\n', 'review test contract IDs')
          replace_once(review_test, '        simulation = rows["originforge.simulation.deterministic"]\n', '        simulation = rows["originforge.simulation.deterministic"]\n        pixelorama = rows["originforge.pixelorama.export"]\n', 'review test Pixelorama row')
          replace_once(review_test, '        self.assertIn("zero-ref", simulation.reason)\n', '        self.assertIn("zero-ref", simulation.reason)\n        self.assertEqual(pixelorama.status, BuiltinBindingReviewStatus.BINDABLE)\n        self.assertIsNone(pixelorama.blocker)\n        self.assertIn("metadata-only", pixelorama.reason)\n', 'review test Pixelorama assertions')
          replace_once(review_test, '        self.assertEqual(len(deferred), 8)\n', '        self.assertEqual(len(deferred), 7)\n', 'deferred review count')

          phase47b = 'tests/test_phase47b_simulation_request_binding.py'
          replace_once(phase47b, '    DeterministicSimulationInputBinder,\n', '    DeterministicSimulationInputBinder,\n    PixeloramaSpritesheetExportInputBinder,\n', 'Phase47B Pixelorama binder import')
          replace_once(phase47b, '    def test_builtin_registry_is_exactly_code_plus_simulation_and_zero_ref_closed(self) -> None:\n', '    def test_builtin_registry_preserves_code_simulation_and_adds_pixelorama(self) -> None:\n', 'Phase47B registry test name')
          replace_once(phase47b, '            ("binder.code.bounded-retry@1", "binder.simulation.deterministic@1"),\n', '            (\n                "binder.code.bounded-retry@1",\n                "binder.pixelorama.spritesheet-export@1",\n                "binder.simulation.deterministic@1",\n            ),\n', 'Phase47B registry IDs')
          replace_once(phase47b, '        code = CodeBoundedRetryInputBinder().descriptor\n        simulation = DeterministicSimulationInputBinder().descriptor\n        self.assertEqual(first.descriptors[0], code)\n        self.assertEqual(first.descriptors[1], simulation)\n        self.assertEqual(simulation.accepted_input_roles, ())\n', '        code = CodeBoundedRetryInputBinder().descriptor\n        pixelorama = PixeloramaSpritesheetExportInputBinder().descriptor\n        simulation = DeterministicSimulationInputBinder().descriptor\n        self.assertEqual(first.descriptors[0], code)\n        self.assertEqual(first.descriptors[1], pixelorama)\n        self.assertEqual(first.descriptors[2], simulation)\n        self.assertEqual(pixelorama.accepted_input_roles, ("pixelorama_project",))\n        self.assertEqual(simulation.accepted_input_roles, ())\n', 'Phase47B descriptor assertions')

          phase48b = Path('tests/test_phase48b_pixelorama_request_binding.py')
          text = phase48b.read_text(encoding='utf-8')
          old = '        with self.assertRaisesRegex(RuntimeError, "input resolution failed"):\n            self._bound_chain(source_ref=drifted)\n'
          if text.count(old) != 1:
              raise SystemExit('Phase48B drift assertion guard mismatch')
          phase48b.write_text(text.replace(old, '        with self.assertRaisesRegex(RuntimeError, "hash drifted"):\n            self._bound_chain(source_ref=drifted)\n'), encoding='utf-8')
          PY

      - name: Self-remove helper and commit bounded 48B wiring
        run: |
          rm .github/workflows/phase48b-wire-binding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/origin_forge/production_dispatch_binding.py src/origin_forge/production_dispatch_binding_review.py tests/test_production_dispatch_binding_review.py tests/test_phase47b_simulation_request_binding.py tests/test_phase48b_pixelorama_request_binding.py .github/workflows/phase48b-wire-binding.yml
          git diff --cached --check
          git commit -m "feat: wire Pixelorama export request binding"
          git push origin HEAD:chatgpt/phase48b-pixelorama-export-binding
