name: Phase 48A contract wiring

on:
  push:
    branches: [chatgpt/phase48a-pixelorama-export-contract]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 48A branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/phase48a-pixelorama-export-contract
          fetch-depth: 0

      - name: Wire Pixelorama validator and contract exactly
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          path = 'src/origin_forge/production_work_order_builtin.py'
          replace_once(path, '    WorkOrderInputRef,\n    content_hash,\n', '    WorkOrderInputRef,\n    WorkOrderRefType,\n    content_hash,\n', 'builtin WorkOrderRefType import')
          replace_once(path, 'from .production_work_order_simulation import (\n', 'from .production_work_order_pixelorama import (\n    PIXELORAMA_ADAPTER_ID,\n    PIXELORAMA_CONTRACT_ID,\n    PixeloramaSpritesheetExportDispatchValidator,\n)\nfrom .production_work_order_simulation import (\n', 'builtin Pixelorama import')
          replace_once(path, '        "originforge.pixelorama.export",\n        "originforge.blender.model3d",', '        "originforge.blender.model3d",', 'remove Pixelorama deferred row')
          old_rows = '        BuiltinDispatchReview(\n            SIMULATION_ADAPTER_ID,\n            BuiltinDispatchReviewStatus.SUPPORTED,\n            "deterministic simulation accepts a self-contained bounded declarative Phase-25 semantic template with no input refs or runtime authority",\n        ),\n'
          new_rows = old_rows + '        BuiltinDispatchReview(\n            PIXELORAMA_ADAPTER_ID,\n            BuiltinDispatchReviewStatus.SUPPORTED,\n            "Pixelorama spritesheet export accepts one exact Artifact ref and an inert payload while editor/profile/process authority remains downstream and infrastructure-owned",\n        ),\n'
          replace_once(path, old_rows, new_rows, 'add Pixelorama supported review')
          replace_once(path, '        CodeBoundedRetryDispatchValidator(),\n        DeterministicSimulationDispatchValidator(),\n', '        CodeBoundedRetryDispatchValidator(),\n        DeterministicSimulationDispatchValidator(),\n        PixeloramaSpritesheetExportDispatchValidator(),\n', 'validator registry')
          marker = 'def build_builtin_dispatch_catalog(\n'
          p = Path(path)
          text = p.read_text(encoding='utf-8')
          if text.count(marker) != 1:
              raise SystemExit('catalog function marker mismatch')
          insertion = "\n".join([
              '',
              'def _pixelorama_contract(adapter) -> DispatchContract:',
              '    validator = PixeloramaSpritesheetExportDispatchValidator()',
              '    return DispatchContract(',
              '        contract_id=PIXELORAMA_CONTRACT_ID,',
              '        contract_version="1",',
              '        adapter_id=adapter.adapter_id,',
              '        adapter_fingerprint=adapter.implementation_fingerprint,',
              '        validator_id=validator.validator_id,',
              '        validator_fingerprint=validator.validator_fingerprint,',
              '        payload_schema_id=validator.payload_schema_id,',
              '        payload_schema_hash=validator.payload_schema_hash,',
              '        allowed_input_ref_types=(WorkOrderRefType.ARTIFACT,),',
              '        max_payload_bytes=2,',
              '        max_input_refs=1,',
              '    )',
              '',
              '',
          ])
          p.write_text(text.replace(marker, insertion + marker), encoding='utf-8')
          replace_once(path, '    dispatch boundary. A simulation-only catalog receives the new deterministic\n    simulation contract. A later upstream-authority phase may deliberately widen\n    the mixed/full catalog after independently re-freezing Goal/PREPPOL authority.\n', '    dispatch boundary. A simulation-only catalog receives the deterministic\n    simulation contract and a Pixelorama-only catalog receives the spritesheet-export\n    contract. The full catalog remains code-only for Phase-45/46 authority. A\n    non-code catalog that contains more than one reviewed adapter fails closed\n    instead of choosing by ordering.\n', 'catalog docstring')
          old_tail = '    simulation = adapters.get(SIMULATION_ADAPTER_ID)\n    if simulation is not None:\n        return DispatchContractCatalog.create(\n            phase32_catalog,\n            (_simulation_contract(simulation),),\n        )\n    raise ValueError("Phase-32 catalog lacks a reviewed Phase-33 dispatch adapter")\n'
          new_tail = '    simulation = adapters.get(SIMULATION_ADAPTER_ID)\n    pixelorama = adapters.get(PIXELORAMA_ADAPTER_ID)\n    reviewed_non_code = tuple(\n        value for value in (simulation, pixelorama) if value is not None\n    )\n    if len(reviewed_non_code) > 1:\n        raise ValueError(\n            "Phase-32 catalog contains multiple reviewed non-code Phase-33 adapters"\n        )\n    if simulation is not None:\n        return DispatchContractCatalog.create(\n            phase32_catalog,\n            (_simulation_contract(simulation),),\n        )\n    if pixelorama is not None:\n        return DispatchContractCatalog.create(\n            phase32_catalog,\n            (_pixelorama_contract(pixelorama),),\n        )\n    raise ValueError("Phase-32 catalog lacks a reviewed Phase-33 dispatch adapter")\n'
          replace_once(path, old_tail, new_tail, 'catalog selection tail')

          test_path = 'tests/test_production_work_order_builtin.py'
          replace_once(test_path, '            "originforge.simulation.deterministic",\n        ):', '            "originforge.simulation.deterministic",\n            "originforge.pixelorama.export",\n        ):', 'legacy review supported set')
          replace_once(test_path, '            "originforge.pixelorama.export",\n            "originforge.blender.model3d",', '            "originforge.blender.model3d",', 'legacy review deferred set')
          PY

      - name: Self-remove helper and commit bounded wiring
        run: |
          rm .github/workflows/phase48a-wire-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/origin_forge/production_work_order_builtin.py tests/test_production_work_order_builtin.py .github/workflows/phase48a-wire-contract.yml
          git diff --cached --check
          git commit -m "feat: wire Pixelorama export dispatch contract"
          git push origin HEAD:chatgpt/phase48a-pixelorama-export-contract
