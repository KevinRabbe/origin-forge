[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "origin-forge"
version = "0.2.0.dev0"
description = "Local autonomous production infrastructure built around durable verified state."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = []

[project.scripts]
origin-forge = "origin_forge.cli_entry:main"
origin-forge-attempt = "origin_forge.orchestration_cli:main"
origin-forge-cockpit = "origin_forge.production_interface_cli:main"

[tool.setuptools.packages.find]
where = ["src"]