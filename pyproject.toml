[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "origin-forge"
version = "0.5.0"
description = "Local autonomous production infrastructure built around durable verified state."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = []

[project.scripts]
origin-forge = "origin_forge.cli:main"
origin-forge-attempt = "origin_forge.orchestration_cli:main"
origin-forge-cockpit = "origin_forge.production_interface_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.12"
files = [
    "src/origin_forge/runtime.py",
    "src/origin_forge/db.py",
    "src/origin_forge/cli.py",
    "src/origin_forge/service.py",
    "src/origin_forge/review.py",
    "src/origin_forge/production_actions.py",
    "src/origin_forge/production_trace.py",
    "src/origin_forge/production_interface_snapshot.py",
]
ignore_missing_imports = true
